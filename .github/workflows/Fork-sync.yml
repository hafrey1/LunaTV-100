name: Sync LunaTV

permissions:
  contents: write

on:
  schedule:
    - cron: "0 17 * * *" # 北京时间每天 01:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/MoonTechLab/LunaTV.git
          git fetch upstream main

      - name: Sync upstream files
        run: |
          # 保存自己仓库的 workflow
          mkdir -p /tmp/my-workflows
          cp -a .github/workflows/. /tmp/my-workflows/

          # 获取官方最新代码
          git checkout upstream/main -- .

          # 恢复自己仓库的 workflow
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/my-workflows/. .github/workflows/

          # 检查修改
          git status

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "没有新的更新"
            exit 0
          fi

          git commit -m "sync: update from MoonTechLab/LunaTV"

      - name: Push changes
        run: |
          git push origin main

      - name: Show result
        run: |
          echo "================================"
          echo "LunaTV 同步完成"
          echo "当前提交："
          git log -1 --oneline
          echo "================================"
